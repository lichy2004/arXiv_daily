name: Run arXiv Papers Daily

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * *'

concurrency:
  group: arxiv-daily-notion-sync
  cancel-in-progress: false

permissions:
  contents: write

env:
  NOTION_DATA_SOURCE_ID: 4334d614-6676-4d47-acaa-a6637ecec9a5

jobs:
  build:
    name: update
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch arXiv papers
        run: python fetch_arxiv.py

      - name: Validate paper JSON
        run: python -m json.tool docs/paper_arxiv.json > /dev/null

      - name: Commit fetched paper archive
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update arXiv papers daily"
          file_pattern: docs/paper_arxiv.json
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Verify Notion configuration
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "NOTION_TOKEN is not configured. Add it as a repository Actions secret."
            exit 1
          fi

      - name: Sync papers to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python sync_to_notion.py --input docs/paper_arxiv.json
