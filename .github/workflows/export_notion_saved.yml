name: Export Saved Notion Papers

on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *'

concurrency:
  group: notion-saved-paper-export
  cancel-in-progress: false

permissions:
  contents: write

env:
  NOTION_DATA_SOURCE_ID: 4334d614-6676-4d47-acaa-a6637ecec9a5

jobs:
  export:
    name: export
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Notion configuration
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "NOTION_TOKEN is not configured. Add it as a repository Actions secret."
            exit 1
          fi

      - name: Export saved papers
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python export_notion_saved.py --output docs/paper_save.json

      - name: Validate saved paper JSON
        run: python -m json.tool docs/paper_save.json > /dev/null

      - name: Commit saved paper export
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: export saved Notion papers"
          file_pattern: docs/paper_save.json
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
